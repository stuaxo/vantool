# Builds and tests on every push and pull request.  Pushing a tag like v1.0 also publishes a release.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build
        run: src/build-linux.sh
      - name: Test vantool
        run: python3 tools/test_vantool.py --no-dos
      - name: Test vanplay
        run: python3 tools/test_vanplay.py --no-dos
      - name: Package
        run: tools/package.sh linux "${GITHUB_REF_NAME//\//-}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  dos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-watcom/setup-watcom@v0
        with:
          version: "2.0"
      - name: Build
        run: src/build-dos.sh
      - name: Package
        run: tools/package.sh dos "${GITHUB_REF_NAME//\//-}"
      - uses: actions/upload-artifact@v4
        with:
          name: dos
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, dos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
